<mat-card class="demis-paste-box" role="region" aria-labelledby="paste-box-title">
  <div class="demis-paste-box-info">
    <div id="paste-box-title" class="demis-paste-box-title">Datenübernahme</div>
    <div class="demis-paste-box-description">Inhalte bequem aus der Zwischenablage übernehmen</div>
  </div>
  <div class="demis-paste-box-action">
    <button id="btn-fill-form" type="button" mat-stroked-button (click)="readFromClipboard()"
            aria-label="Zwischenablage einfügen" aria-describedby="paste-status">
      <mat-icon class="material-icons-outlined">description</mat-icon>
      <span>Einfügen</span>
    </button>
  </div>
  <!-- LiveAnnouncer handles status announcements; keep this button description non-live to avoid duplicate live announcements. -->
  <div id="paste-status" class="cdk-visually-hidden" aria-live="off">{{ pasteStatus() }}</div>
</mat-card>
