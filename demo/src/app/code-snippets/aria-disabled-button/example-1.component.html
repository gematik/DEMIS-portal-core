<main style="display: flex; gap: 1rem; flex-direction: column; align-items: flex-start;">
  <h1>Button without a type attribute (implicit submit)</h1>
  <p>A button without a type attribute is a submit button by default, so the directive announces the fixed explanation
    automatically.</p>

  <form method="submit" (submit)="onSubmit($event)">
    <button mat-button class="btn style dark--color" [gemDemisAriaDisabled]="isDisabled()">Submit</button>
  </form>

  <button mat-stroked-button type="button" (click)="isDisabled.set(!isDisabled())">Toggle availability</button>
</main>
