<main style="display: flex; gap: 1rem; flex-direction: column; align-items: flex-start;">
  <h1>Button with an explicit type="button" attribute</h1>
  <p id="aria-disabled-button-example-3-description">
    A non-submit action stays keyboard-focusable and blocked while disabled, but does not get the fixed submit
    announcement. Provide your own explanation via
    gemDemisAriaDisabledDescribedBy.
  </p>

  <form method="submit">
    <button mat-button class="btn style dark--color" [gemDemisAriaDisabled]="isDisabled()"
      gemDemisAriaDisabledDescribedBy="aria-disabled-button-example-3-description" type="button"
      (click)="onClick($event)">
      Apply
    </button>
  </form>

  <button mat-stroked-button type="button" (click)="isDisabled.set(!isDisabled())">Toggle availability</button>
</main>
